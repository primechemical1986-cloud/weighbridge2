<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Weighbridge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;min-height:100vh}
.topbar{background:#1a237e;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:1px}
.tabs{display:flex;gap:4px}
.tab{padding:7px 18px;border:none;border-radius:6px 6px 0 0;background:rgba(255,255,255,0.15);color:#fff;font-size:14px;cursor:pointer;transition:background 0.2s}
.tab.active{background:#fff;color:#1a237e;font-weight:700}
.section{display:none;padding:16px;max-width:700px;margin:0 auto}
.section.active{display:block}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.09);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;color:#1a237e;margin-bottom:14px;border-bottom:2px solid #e8eaf6;padding-bottom:8px}
label{display:block;font-size:12px;color:#555;margin-bottom:2px;font-weight:600}
input,select{width:100%;padding:9px 11px;border:1.5px solid #dde;border-radius:7px;font-size:14px;margin-bottom:11px;background:#fafbff;transition:border 0.2s}
input:focus,select:focus{outline:none;border-color:#1a237e}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:opacity 0.2s}
.btn:active{opacity:0.8}
.btn-blue{background:#1a237e;color:#fff}
.btn-green{background:#2e7d32;color:#fff}
.btn-orange{background:#e65100;color:#fff}
.btn-red{background:#c62828;color:#fff}
.btn-grey{background:#546e7a;color:#fff}
.pend-card{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:14px;margin-bottom:10px;border-left:4px solid #1a237e;cursor:pointer}
.pend-card h3{font-size:14px;font-weight:700;color:#1a237e}
.pend-card p{font-size:13px;color:#555;margin-top:3px}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;margin-left:6px}
.badge-tare{background:#e3f2fd;color:#1565c0}
.badge-gross{background:#e8f5e9;color:#2e7d32}
#rec-table{width:100%;border-collapse:collapse;font-size:13px}
#rec-table th{background:#e8eaf6;color:#1a237e;padding:8px 6px;text-align:left;font-size:12px}
#rec-table td{padding:8px 6px;border-bottom:1px solid #f0f0f0}
#rec-table tr:hover td{background:#f5f5ff;cursor:pointer}
.msg{padding:10px 14px;border-radius:7px;margin-bottom:10px;font-size:13px;display:none}
.msg.ok{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.msg.err{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.autocomplete-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #dde;border-radius:0 0 7px 7px;z-index:200;max-height:160px;overflow-y:auto;display:none}
.ac-item{padding:8px 12px;cursor:pointer;font-size:13px}
.ac-item:hover{background:#e8eaf6}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:300}
.modal-overlay.open{display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:22px;width:90%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.modal h3{font-size:16px;font-weight:700;color:#1a237e;margin-bottom:14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:14px}
.detail-grid .lbl{font-size:11px;color:#888;font-weight:600}
.detail-grid .val{font-size:14px;color:#222;font-weight:700}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.detail-actions button{flex:1;min-width:80px;padding:9px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
#edit-save-bar{display:none;background:#fff3e0;border-radius:8px;padding:12px;margin-bottom:12px;border:1px solid #ffe0b2}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{margin-bottom:0;flex:1}
.search-row button{padding:9px 16px;border:none;border-radius:7px;background:#1a237e;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px}

/* ===== PRINT STYLES ===== */
@media print{
  body{background:#fff}
  .topbar,.tabs,.section:not(#sec-print){display:none!important}
  #sec-print{display:block!important;padding:0;max-width:100%}
  .no-print{display:none!important}
  .print-page{page-break-after:always;width:190mm;margin:0 auto;padding:6mm}
  .print-page:last-child{page-break-after:auto}
}
.print-wrap{display:none}
@media print{.print-wrap{display:block}}
.slip{border:1.5px solid #000;width:100%;font-family:Arial,sans-serif;font-size:11pt}
.slip-header{text-align:center;padding:6px 8px;border-bottom:1.5px solid #000}
.slip-header h2{font-size:16pt;font-weight:900;letter-spacing:2px;margin-bottom:2px}
.slip-header p{font-size:9pt;color:#333}
.slip-title{text-align:center;background:#f0f0f0;padding:4px;font-size:12pt;font-weight:700;border-bottom:1px solid #000}
.slip-copy{text-align:right;padding:3px 8px;font-size:9pt;font-style:italic;border-bottom:1px solid #ccc;color:#555}
.slip-body{padding:6px 10px}
.slip-row{display:flex;border-bottom:1px solid #ddd;padding:3px 0}
.slip-row .sk{width:42%;font-size:9.5pt;color:#444;font-weight:600}
.slip-row .sv{width:58%;font-size:10pt;font-weight:700}
.slip-weights{display:flex;justify-content:space-around;padding:8px 0;border-bottom:2px solid #000;background:#f9f9f9}
.slip-wbox{text-align:center}
.slip-wbox .wlbl{font-size:8pt;color:#555;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.slip-wbox .wval{font-size:13pt;font-weight:900;color:#000}
.slip-wbox .wunit{font-size:8pt;color:#666}
.slip-footer{text-align:center;padding:5px 8px;font-size:8pt;color:#444;border-top:1px solid #ccc}
.slip-sign{display:flex;justify-content:space-between;padding:8px 12px;margin-top:4px}
.slip-sign .sline{text-align:center;border-top:1px solid #000;padding-top:3px;font-size:8pt;width:35%}
</style>
</head>
<body>

<div class="topbar">
  <h1>⚖ WEIGHBRIDGE</h1>
  <div class="tabs">
    <button class="tab active" onclick="showTab('entry')">Entry</button>
    <button class="tab" onclick="showTab('pending')">Pending</button>
    <button class="tab" onclick="showTab('records')">Records</button>
  </div>
</div>

<!-- ===== ENTRY TAB ===== -->
<div id="sec-entry" class="section active">
  <div id="entry-msg" class="msg"></div>

  <div id="edit-save-bar">
    <div style="font-size:13px;font-weight:700;color:#e65100;margin-bottom:8px">✏️ Edit Mode — Receipt #<span id="edit-rno"></span></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-green" style="margin:0;flex:1" onclick="saveEntry()">💾 Save Changes</button>
      <button class="btn btn-grey" style="margin:0;flex:1" onclick="cancelEdit()">✕ Cancel</button>
    </div>
  </div>

  <div class="card">
    <h2>Vehicle & Party Details</h2>
    <div class="row2">
      <div>
        <label>Receipt No *</label>
        <input id="e-rno" type="text" placeholder="Auto / Manual">
      </div>
      <div>
        <label>Entry Date *</label>
        <input id="e-date" type="date">
      </div>
    </div>
    <label>Vehicle No *</label>
    <input id="e-veh" type="text" placeholder="e.g. GJ06AB1234" style="text-transform:uppercase">
    <label>Party Name *</label>
    <div class="autocomplete-wrap">
      <input id="e-party" type="text" placeholder="Party / Company name" autocomplete="off" oninput="acParty(this.value)" onblur="setTimeout(()=>document.getElementById('ac-party').style.display='none',200)">
      <div id="ac-party" class="ac-list"></div>
    </div>
    <label>Material</label>
    <div class="autocomplete-wrap">
      <input id="e-mat" type="text" placeholder="Chemical / Material name" autocomplete="off" oninput="acMat(this.value)" onblur="setTimeout(()=>document.getElementById('ac-mat').style.display='none',200)">
      <div id="ac-mat" class="ac-list"></div>
    </div>
  </div>

  <div class="card">
    <h2>Weight Details</h2>
    <div class="row2">
      <div>
        <label>Tare Weight (KG)</label>
        <input id="e-tare" type="number" placeholder="0">
      </div>
      <div>
        <label>Gross Weight (KG)</label>
        <input id="e-gross" type="number" placeholder="0">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>Density (g/mL)</label>
        <input id="e-dens" type="number" step="0.001" placeholder="Optional">
      </div>
      <div>
        <label>Direction</label>
        <select id="e-dir">
          <option value="">-- Select --</option>
          <option value="IN">IN</option>
          <option value="OUT">OUT</option>
        </select>
      </div>
    </div>
    <label>Remarks</label>
    <input id="e-rem" type="text" placeholder="Optional remarks">
  </div>

  <button class="btn btn-blue" onclick="saveEntry()">💾 Save Entry</button>
  <button class="btn btn-green" onclick="saveAndPrint()">🖨️ Save & Print Slip</button>
</div>

<!-- ===== PENDING TAB ===== -->
<div id="sec-pending" class="section">
  <div id="pend-msg" class="msg"></div>
  <div id="pend-list"><p style="text-align:center;color:#888;padding:30px">Loading...</p></div>
</div>

<!-- ===== RECORDS TAB ===== -->
<div id="sec-records" class="section">
  <div class="card" style="padding:12px">
    <div class="search-row">
      <input id="rec-search" type="text" placeholder="Search party name..." oninput="filterRecords()">
      <button onclick="loadRecords()">🔄 Refresh</button>
    </div>
    <div id="rec-msg" class="msg"></div>
    <div style="overflow-x:auto">
      <table id="rec-table">
        <thead><tr>
          <th>Receipt</th><th>Date</th><th>Vehicle</th><th>Party</th><th>Material</th><th>Net KG</th><th>Dir</th>
        </tr></thead>
        <tbody id="rec-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>📦 Monthly Backup</h2>
    <div class="row2">
      <div>
        <label>Year</label>
        <select id="bk-yr"></select>
      </div>
      <div>
        <label>Month</label>
        <select id="bk-mo">
          <option value="01">January</option><option value="02">February</option>
          <option value="03">March</option><option value="04">April</option>
          <option value="05">May</option><option value="06">June</option>
          <option value="07">July</option><option value="08">August</option>
          <option value="09">September</option><option value="10">October</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
      </div>
    </div>
    <button class="btn btn-orange" onclick="doBackup()">📥 Export CSV & Delete</button>
  </div>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div id="detail-modal" class="modal-overlay">
  <div class="modal">
    <h3>📋 Entry Detail</h3>
    <div class="detail-grid" id="detail-grid"></div>
    <div class="detail-actions">
      <button style="background:#1a237e;color:#fff" onclick="printFromDetail()">🖨️ Print</button>
      <button style="background:#e65100;color:#fff" onclick="editFromDetail()">✏️ Edit</button>
      <button style="background:#c62828;color:#fff" onclick="deleteFromDetail()">🗑️ Delete</button>
      <button style="background:#546e7a;color:#fff" onclick="closeDetail()">✕ Close</button>
    </div>
  </div>
</div>

<!-- ===== PENDING WEIGHT MODAL ===== -->
<div id="pend-modal" class="modal-overlay">
  <div class="modal">
    <h3 id="pm-title">Enter Second Weight</h3>
    <p id="pm-info" style="font-size:13px;color:#555;margin-bottom:14px"></p>
    <label>Weight (KG) *</label>
    <input id="pm-weight" type="number" placeholder="Enter weight">
    <label>Density (g/mL)</label>
    <input id="pm-dens" type="number" step="0.001" placeholder="Optional">
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-green" style="margin:0;flex:1" onclick="completePending()">✅ Save & Print</button>
      <button class="btn btn-grey" style="margin:0;flex:1" onclick="closePendModal()">✕ Cancel</button>
    </div>
  </div>
</div>

<!-- ===== HIDDEN PRINT AREA ===== -->
<div id="sec-print" style="display:none">
  <div class="print-wrap" id="print-area"></div>
</div>

<script>
const SURL='https://bsmspbozhchjqpkpftnx.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzbXNwYm96aGNoanFwa3BmdG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTA0MzksImV4cCI6MjA5Nzg2NjQzOX0.aT9ftpeVyg5hHUhbvylR8tPbY3eL1-Z_mE90H-lRJsY';
const H={'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json','Prefer':'return=representation'};

let editId=null, curRno='', detailRow=null, pendRow=null;
let allRecords=[];

// ── Helpers ──
function sf(id,v){if(document.getElementById(id))document.getElementById(id).value=v;}
function gf(id){return(document.getElementById(id)||{}).value||'';}
function showMsg(id,msg,type){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.className='msg '+type;el.style.display='block';setTimeout(()=>el.style.display='none',4000);}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(d){return d?d.split('-').reverse().join('-'):'';}

// ── Tab switching ──
function showTab(t){
  ['entry','pending','records'].forEach(x=>{
    document.getElementById('sec-'+x).classList.toggle('active',x===t);
    document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['entry','pending','records'][i]===t));
  });
  if(t==='pending')loadPending();
  if(t==='records')loadRecords();
}

// ── Receipt number ──
async function nextRno(){
  var r=await fetch(SURL+'/rest/v1/weighbridge?select=receipt_no&order=id.desc&limit=1',{headers:H});
  var d=r.ok?await r.json():[];
  if(d.length&&d[0].receipt_no){
    var last=parseInt(d[0].receipt_no)||0;
    return String(last+1).padStart(4,'0');
  }
  return '0001';
}

// ── Autocomplete ──
async function acParty(v){
  if(v.length<2){document.getElementById('ac-party').style.display='none';return;}
  var r=await fetch(SURL+'/rest/v1/weighbridge?select=party_name&party_name=ilike.'+encodeURIComponent('*'+v+'*')+'&order=id.desc&limit=20',{headers:H});
  var d=r.ok?await r.json():[];
  var names=[...new Set(d.map(x=>x.party_name).filter(Boolean))];
  var el=document.getElementById('ac-party');
  if(!names.length){el.style.display='none';return;}
  el.innerHTML=names.map(n=>'<div class="ac-item" onmousedown="pickParty(\''+n.replace(/'/g,"\\'")+'\')">'+ n+'</div>').join('');
  el.style.display='block';
}
function pickParty(n){sf('e-party',n);document.getElementById('ac-party').style.display='none';}

async function acMat(v){
  if(v.length<2){document.getElementById('ac-mat').style.display='none';return;}
  var r=await fetch(SURL+'/rest/v1/weighbridge?select=material&material=ilike.'+encodeURIComponent('*'+v+'*')+'&order=id.desc&limit=20',{headers:H});
  var d=r.ok?await r.json():[];
  var names=[...new Set(d.map(x=>x.material).filter(Boolean))];
  var el=document.getElementById('ac-mat');
  if(!names.length){el.style.display='none';return;}
  el.innerHTML=names.map(n=>'<div class="ac-item" onmousedown="pickMat(\''+n.replace(/'/g,"\\'")+'\')">'+ n+'</div>').join('');
  el.style.display='block';
}
function pickMat(n){sf('e-mat',n);document.getElementById('ac-mat').style.display='none';}

// ── Save Entry ──
async function saveEntry(){
  var veh=(gf('e-veh')||'').toUpperCase().trim();
  var party=gf('e-party').trim();
  if(!veh||!party){showMsg('entry-msg','Vehicle No and Party Name required!','err');return;}
  var tare=gf('e-tare')||null;
  var gross=gf('e-gross')||null;
  var dens=gf('e-dens')||null;
  var net=(tare&&gross)?Math.abs(parseFloat(gross)-parseFloat(tare)):null;
  var litres=(net&&dens)?(net/parseFloat(dens)).toFixed(0):null;
  var status=(tare&&gross)?'COMPLETE':'PENDING';
  var pending_type=null;
  if(status==='PENDING'){if(tare&&!gross)pending_type='TARE_DONE';else if(gross&&!tare)pending_type='GROSS_DONE';}
  var rno=gf('e-rno').trim()||(await nextRno());
  var payload={
    receipt_no:rno,
    entry_date:gf('e-date')||today(),
    vehicle_no:veh,
    party_name:party,
    material:gf('e-mat')||null,
    tare_weight:tare?parseFloat(tare):null,
    gross_weight:gross?parseFloat(gross):null,
    net_weight:net?parseFloat(net):null,
    density:dens?parseFloat(dens):null,
    litres:litres?parseFloat(litres):null,
    direction:gf('e-dir')||null,
    remarks:gf('e-rem')||null,
    status:status,
    pending_type:pending_type
  };
  var url,method;
  if(editId){
    url=SURL+'/rest/v1/weighbridge?id=eq.'+editId;
    method='PATCH';
  } else {
    url=SURL+'/rest/v1/weighbridge';
    method='POST';
  }
  var r=await fetch(url,{method:method,headers:H,body:JSON.stringify(payload)});
  if(r.ok){
    showMsg('entry-msg',editId?'✅ Updated!':'✅ Entry saved!','ok');
    cancelEdit();
    clearForm();
  } else {
    var err=await r.json();
    showMsg('entry-msg','❌ Error: '+(err.message||'Save failed'),'err');
  }
}

async function saveAndPrint(){
  var veh=(gf('e-veh')||'').toUpperCase().trim();
  var party=gf('e-party').trim();
  var tare=gf('e-tare');
  var gross=gf('e-gross');
  if(!veh||!party||!tare||!gross){
    showMsg('entry-msg','Vehicle, Party, Tare & Gross required to print!','err');return;
  }
  await saveEntry();
  var r=await fetch(SURL+'/rest/v1/weighbridge?vehicle_no=eq.'+encodeURIComponent(veh)+'&order=id.desc&limit=1',{headers:H});
  var d=r.ok?await r.json():[];
  if(d.length)printSlip(d[0]);
}

function clearForm(){
  ['e-rno','e-veh','e-party','e-mat','e-tare','e-gross','e-dens','e-rem'].forEach(id=>sf(id,''));
  sf('e-dir','');
  sf('e-date',today());
}

// ── Edit/Cancel ──
function cancelEdit(){
  editId=null;curRno='';
  document.getElementById('edit-save-bar').style.display='none';
  clearForm();
}

// ── Pending ──
async function loadPending(){
  document.getElementById('pend-list').innerHTML='<p style="text-align:center;color:#888;padding:30px">Loading...</p>';
  var r=await fetch(SURL+'/rest/v1/weighbridge?status=eq.PENDING&order=id.desc',{headers:H});
  var d=r.ok?await r.json():[];
  if(!d.length){document.getElementById('pend-list').innerHTML='<p style="text-align:center;color:#aaa;padding:30px">No pending entries</p>';return;}
  var html='';
  d.forEach(function(x){
    var typeLabel=x.pending_type==='TARE_DONE'?'Need GROSS':'Need TARE';
    var badgeClass=x.pending_type==='TARE_DONE'?'badge-gross':'badge-tare';
    var wt=x.pending_type==='TARE_DONE'?x.tare_weight:x.gross_weight;
    html+='<div class="pend-card" onclick="openPend('+x.id+')">';
    html+='<h3>'+x.vehicle_no+'<span class="badge '+badgeClass+'">'+typeLabel+'</span></h3>';
    html+='<p>'+x.party_name+(x.material?' | '+x.material:'')+'</p>';
    html+='<p style="font-size:12px;color:#888">First weight: '+(wt||'-')+' KG &nbsp;|&nbsp; '+fmt(x.entry_date)+'</p>';
    html+='</div>';
  });
  document.getElementById('pend-list').innerHTML=html;
}

async function openPend(id){
  var r=await fetch(SURL+'/rest/v1/weighbridge?id=eq.'+id,{headers:H});
  var d=r.ok?await r.json():[];
  if(!d.length)return;
  pendRow=d[0];
  var needGross=pendRow.pending_type==='TARE_DONE';
  document.getElementById('pm-title').textContent=(needGross?'Enter Gross Weight':'Enter Tare Weight');
  document.getElementById('pm-info').textContent=pendRow.vehicle_no+' | '+pendRow.party_name+(pendRow.material?' | '+pendRow.material:'')+' | First: '+(needGross?pendRow.tare_weight:pendRow.gross_weight)+' KG';
  sf('pm-weight','');
  sf('pm-dens',pendRow.density||'');
  document.getElementById('pend-modal').classList.add('open');
}

async function completePending(){
  if(!pendRow)return;
  var w=parseFloat(gf('pm-weight'));
  if(!w){showMsg('pend-msg','Enter weight!','err');return;}
  var dens=parseFloat(gf('pm-dens'))||pendRow.density||null;
  var needGross=pendRow.pending_type==='TARE_DONE';
  var tare=needGross?pendRow.tare_weight:w;
  var gross=needGross?w:pendRow.gross_weight;
  var net=Math.abs(gross-tare);
  var litres=(dens&&net)?(net/dens).toFixed(0):null;
  var dir=needGross?'IN':'OUT';
  var payload={
    gross_weight:gross,tare_weight:tare,net_weight:net,
    density:dens,litres:litres?parseFloat(litres):null,
    direction:dir,status:'COMPLETE',pending_type:null
  };
  var r=await fetch(SURL+'/rest/v1/weighbridge?id=eq.'+pendRow.id,{method:'PATCH',headers:H,body:JSON.stringify(payload)});
  if(r.ok){
    closePendModal();
    var d=r.ok?await r.json():[];
    var row=Object.assign({},pendRow,payload);
    printSlip(row);
    loadPending();
  } else {
    showMsg('pend-msg','❌ Save failed','err');
  }
}

function closePendModal(){pendRow=null;document.getElementById('pend-modal').classList.remove('open');}

// ── Records ──
async function loadRecords(){
  document.getElementById('rec-body').innerHTML='<tr><td colspan="7" style="text-align:center;color:#aaa;padding:20px">Loading...</td></tr>';
  var r=await fetch(SURL+'/rest/v1/weighbridge?order=id.desc&limit=200',{headers:H});
  allRecords=r.ok?await r.json():[];
  filterRecords();
}

function filterRecords(){
  var q=(gf('rec-search')||'').toLowerCase().trim();
  var rows=q?allRecords.filter(x=>x.party_name&&x.party_name.toLowerCase().includes(q)):allRecords;
  var html='';
  rows.forEach(function(x){
    html+='<tr onclick="openDetail('+x.id+')">';
    html+='<td>'+( x.receipt_no||'-')+'</td>';
    html+='<td>'+fmt(x.entry_date)+'</td>';
    html+='<td>'+(x.vehicle_no||'-')+'</td>';
    html+='<td>'+(x.party_name||'-')+'</td>';
    html+='<td>'+(x.material||'-')+'</td>';
    html+='<td>'+(x.net_weight?x.net_weight.toLocaleString():'—')+'</td>';
    html+='<td>'+(x.direction||'-')+'</td>';
    html+='</tr>';
  });
  document.getElementById('rec-body').innerHTML=html||'<tr><td colspan="7" style="text-align:center;color:#aaa;padding:20px">No records found</td></tr>';
}

// ── Detail Modal ──
async function openDetail(id){
  var row=allRecords.find(x=>x.id===id);
  if(!row){
    var r=await fetch(SURL+'/rest/v1/weighbridge?id=eq.'+id,{headers:H});
    var d=r.ok?await r.json():[];
    if(!d.length)return;
    row=d[0];
  }
  detailRow=row;
  var g=document.getElementById('detail-grid');
  g.innerHTML=[
    ['Receipt No',row.receipt_no||'-'],
    ['Date',fmt(row.entry_date)],
    ['Vehicle',row.vehicle_no||'-'],
    ['Party',row.party_name||'-'],
    ['Material',row.material||'-'],
    ['Direction',row.direction||'-'],
    ['Tare (KG)',row.tare_weight?row.tare_weight.toLocaleString():'-'],
    ['Gross (KG)',row.gross_weight?row.gross_weight.toLocaleString():'-'],
    ['Net (KG)',row.net_weight?row.net_weight.toLocaleString():'-'],
    ['Density',row.density||'-'],
    ['Litres',row.litres?row.litres.toLocaleString():'-'],
    ['Status',row.status||'-']
  ].map(([l,v])=>'<div class="lbl">'+l+'</div><div class="val">'+v+'</div>').join('');
  document.getElementById('detail-modal').classList.add('open');
}

function closeDetail(){
  document.getElementById('detail-modal').classList.remove('open');
  detailRow=null;
}

function printFromDetail(){
  if(!detailRow)return;
  var row=detailRow;
  closeDetail();
  printSlip(row);
}

function editFromDetail(){
  if(!detailRow)return;
  var row=detailRow;
  closeDetail();
  sf('e-rno',row.receipt_no||'');
  sf('e-date',row.entry_date||today());
  sf('e-veh',row.vehicle_no||'');
  sf('e-party',row.party_name||'');
  sf('e-mat',row.material||'');
  sf('e-tare',row.tare_weight||'');
  sf('e-gross',row.gross_weight||'');
  sf('e-dens',row.density||'');
  sf('e-dir',row.direction||'');
  sf('e-rem',row.remarks||'');
  editId=row.id;
  curRno=row.receipt_no||'';
  document.getElementById('edit-rno').textContent=curRno;
  document.getElementById('edit-save-bar').style.display='block';
  showTab('entry');
  window.scrollTo(0,0);
}

async function deleteFromDetail(){
  if(!detailRow)return;
  if(!confirm('Delete receipt '+detailRow.receipt_no+'?\n\nThis cannot be undone.'))return;
  var r=await fetch(SURL+'/rest/v1/weighbridge?id=eq.'+detailRow.id,{method:'DELETE',headers:H});
  if(r.ok){
    showMsg('rec-msg','✅ Entry deleted','ok');
    closeDetail();
    loadRecords();
  } else {
    showMsg('rec-msg','❌ Delete failed','err');
  }
}

// ── Backup ──
async function doBackup(){
  var yr=gf('bk-yr');
  var mo=gf('bk-mo');
  if(!yr||!mo){alert('Select year and month.');return;}
  if(!confirm('Export '+yr+'-'+mo+' data to CSV and delete from database?'))return;
  var from=yr+'-'+mo+'-01';
  var lastDay=new Date(parseInt(yr),parseInt(mo),0).getDate();
  var to=yr+'-'+mo+'-'+String(lastDay).padStart(2,'0');
  var r=await fetch(SURL+'/rest/v1/weighbridge?entry_date=gte.'+from+'&entry_date=lte.'+to+'&order=id.asc',{headers:H});
  var rows=r.ok?await r.json():[];
  if(!rows.length){alert('No data found for '+yr+'-'+mo);return;}
  var cols=['id','receipt_no','entry_date','vehicle_no','party_name','material','tare_weight','gross_weight','net_weight','density','litres','direction','status','remarks'];
  var csv=cols.join(',')+'\n'+rows.map(row=>cols.map(c=>{var v=row[c]===null||row[c]===undefined?'':row[c];return'"'+String(v).replace(/"/g,'""')+'"';}).join(',')).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='weighbridge-'+yr+'-'+mo+'.csv';
  a.click();
  setTimeout(async()=>{
    var dr=await fetch(SURL+'/rest/v1/weighbridge?entry_date=gte.'+from+'&entry_date=lte.'+to,{method:'DELETE',headers:H});
    if(dr.ok)showMsg('rec-msg','✅ Exported & deleted '+rows.length+' records','ok');
    else showMsg('rec-msg','⚠️ Exported but delete failed','err');
    loadRecords();
  },1000);
}

// ── Print Slip ──
function printSlip(row){
  var tare=row.tare_weight?Number(row.tare_weight).toLocaleString():'-';
  var gross=row.gross_weight?Number(row.gross_weight).toLocaleString():'-';
  var net=row.net_weight?Number(row.net_weight).toLocaleString():'-';
  var litres=row.litres?Number(row.litres).toLocaleString():'-';
  var dt=row.entry_date?fmt(row.entry_date):'-';
  var dir=row.direction||'';
  var slip='<table class="slip"><tr><td>';
  slip+='<div class="slip-title">WEIGHBRIDGE RECEIPT</div>';
  slip+='<div class="slip-copy">ORIGINAL</div>';
  slip+='<div class="slip-body">';
  slip+='<div class="slip-row"><span class="sk">Receipt No</span><span class="sv">'+( row.receipt_no||'-')+'</span></div>';
  slip+='<div class="slip-row"><span class="sk">Date</span><span class="sv">'+dt+'</span></div>';
  slip+='<div class="slip-row"><span class="sk">Vehicle No</span><span class="sv">'+(row.vehicle_no||'-')+'</span></div>';
  slip+='<div class="slip-row"><span class="sk">Party Name</span><span class="sv">'+(row.party_name||'-')+'</span></div>';
  slip+='<div class="slip-row"><span class="sk">Material</span><span class="sv">'+(row.material||'-')+'</span></div>';
  if(dir)slip+='<div class="slip-row"><span class="sk">Direction</span><span class="sv">'+dir+'</span></div>';
  if(row.density)slip+='<div class="slip-row"><span class="sk">Density</span><span class="sv">'+row.density+' g/mL</span></div>';
  slip+='</div>';
  slip+='<div class="slip-weights">';
  slip+='<div class="slip-wbox"><div class="wlbl">Tare Weight</div><div class="wval">'+tare+'</div><div class="wunit">KGS</div></div>';
  slip+='<div class="slip-wbox"><div class="wlbl">Gross Weight</div><div class="wval">'+gross+'</div><div class="wunit">KGS</div></div>';
  slip+='<div class="slip-wbox"><div class="wlbl">Net Weight</div><div class="wval">'+net+'</div><div class="wunit">KGS</div></div>';
  if(row.litres)slip+='<div class="slip-wbox"><div class="wlbl">Litres</div><div class="wval">'+litres+'</div><div class="wunit">LTR</div></div>';
  slip+='</div>';
  if(row.remarks)slip+='<div style="padding:4px 10px;font-size:9pt"><b>Remarks:</b> '+row.remarks+'</div>';
  slip+='<div class="slip-sign"><div class="sline">Driver</div><div class="sline">Authorised Signatory</div></div>';
  slip+='</td></tr></table>';

  // Duplicate
  var slip2=slip.replace('ORIGINAL','DUPLICATE');
  document.getElementById('print-area').innerHTML='<div class="print-page">'+slip+'</div><div class="print-page">'+slip2+'</div>';

  var dt2=row.entry_date?row.entry_date.split('-').reverse().join('-'):'';
  document.title=(row.party_name||'')+(row.receipt_no?' - '+row.receipt_no:'')+(row.material?' - '+row.material:'')+(dt2?' - '+dt2:'');
  setTimeout(()=>{window.print();document.title='Weighbridge';},200);
}

// ── Init ──
window.onload=function(){
  sf('e-date',today());
  var yr=new Date().getFullYear();
  var sel=document.getElementById('bk-yr');
  for(var i=yr;i>=yr-3;i--){var o=document.createElement('option');o.value=i;o.textContent=i;sel.appendChild(o);}
  var mo=String(new Date().getMonth()+1).padStart(2,'0');
  sf('bk-mo',mo);
};
</script>
